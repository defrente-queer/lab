baseURL = 'https://defrente-queer.github.io/lab/'
locale = 'es-ES'
title = 'DeFrente LAB'
theme = 'hugo-PaperMod'
defaultContentLanguage = "es"
copyright = "@ 2026 DeFrente"
mainSections = ["posts", "queerzine"]

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# https://github.com/gohugoio/hugo/issues/12152
capitalizeListTitles = false

# Generate "Bearblog"-like URLs !only!, see https://bearblog.dev/.
disableKinds = ["taxonomy"]
# ignoreErrors = ["error-disable-taxonomy"]
[taxonomies]
tag = "tags"

[permalinks]
blog = "/:slugorcontentbasename/"
tags = "/blog/:slug"

[markup.goldmark.renderer]
unsafe = true
[markup.tableOfContents]
startLevel = 2
endLevel = 3
[markup.highlight]
# Class-based output follows the light/dark scheme, see assets/chroma.css.
noClasses = false

[params]
title = "DeFrente LAB"
description = "Laboratorio de Activista de DeFrente"
dateFormat = "2006-01-02"
defaultTheme = "auto"
# disableThemeToggle = true
ShowShareButtons = false
ShowReadingTime = true
# disableSpecial1stPost = true
displayFullLangName = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
#ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true

[params.label]
icon = "images/logo.png"
iconHeight = 120

[params.rightLogo]
image = "images/memorias-lgtb-futuros-queer.png"
alt = "Memorias LGTB - Futuros Queer"
height = 120

[[menu.main]]
name = "Inicio"
pageRef = "/"
weight = 10

[[menu.main]]
name = "Laboratorio"
pageRef = "/posts"
weight = 20

[[menu.main]]
name = "Queerzine"
pageRef = "/queerzine"
weight = 30

[services.rss]
limit = 42

[pagination]
pagerSize = 16

[outputs]
home = ["HTML", "RSS", "JSON"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'